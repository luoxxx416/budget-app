<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Budget</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

<div class="container">

  <!-- ====================================================== -->
  <!-- LOGIN -->
  <!-- ====================================================== -->

  <section id="loginView" class="card">

    <h1>Budget</h1>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="loginButton">
      Sign In
    </button>

    <p id="loginError" class="error"></p>

  </section>


  <!-- ====================================================== -->
  <!-- APP -->
  <!-- ====================================================== -->

  <main id="appView" hidden>

    <header>

      <div>
        <h1>My Budget</h1>
        <p id="monthName"></p>
      </div>

      <button
        id="logoutButton"
        class="secondary"
      >
        Sign Out
      </button>

    </header>


    <!-- ==================================================== -->
    <!-- SUMMARY -->
    <!-- ==================================================== -->

    <section class="summary">

      <div class="card stat">

        <span>Spent</span>

        <strong id="spent">
          $0.00
        </strong>

      </div>


      <div class="card stat">

        <span>Remaining</span>

        <strong id="remaining">
          $0.00
        </strong>

      </div>


      <div class="card stat">

        <span>Total Savings</span>

        <strong id="savings">
          $0.00
        </strong>

      </div>

    </section>


    <!-- ==================================================== -->
    <!-- SETTINGS -->
    <!-- ==================================================== -->

    <section class="card">

      <h2>Settings</h2>

      <label>
        Monthly Budget
      </label>

      <div class="row">

        <input
          id="budgetInput"
          type="number"
          step="0.01"
        >

        <button id="saveBudget">
          Save
        </button>

      </div>


      <label>
        Total Savings Goal
      </label>

      <div class="row">

        <input
          id="goalInput"
          type="number"
          step="0.01"
        >

        <button id="saveGoal">
          Save
        </button>

      </div>

    </section>


    <!-- ==================================================== -->
    <!-- ADD EXPENSE -->
    <!-- ==================================================== -->

    <section class="card">

      <h2>Add Expense</h2>

      <label>Amount</label>

      <input
        id="amountInput"
        type="number"
        step="0.01"
        placeholder="0.00"
      >


      <label>Category</label>

      <select id="categoryInput">

        <option>Food</option>
        <option>Grocery</option>
        <option>Restaurant</option>
        <option>Transportation</option>
        <option>Shopping</option>
        <option>Entertainment</option>
        <option>Bills</option>
        <option>Other</option>

      </select>


      <label>Description</label>

      <input
        id="descriptionInput"
        type="text"
        placeholder="Optional"
      >


      <label>Date</label>

      <input
        id="dateInput"
        type="date"
      >


      <button id="addExpenseButton">
        Add Expense
      </button>

    </section>


    <!-- ==================================================== -->
    <!-- TRANSACTIONS -->
    <!-- ==================================================== -->

    <section class="card">

      <h2>Transactions</h2>

      <div id="transactions"></div>

    </section>

  </main>

</div>

<script
  type="module"
  src="app.js"
></script>

</body>

</html>

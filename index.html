<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Budget Logger</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>


  <!-- ======================================================
       LOGIN
       ====================================================== -->

  <main
    id="loginView"
    class="login-container"
    hidden
  >

    <section class="login-card">

      <h1>
        Budget Logger
      </h1>


      <p>
        Sign in to manage your budget.
      </p>


      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Email"
      >


      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
      >


      <button
        id="loginButton"
        type="button"
      >
        Sign In
      </button>


      <p
        id="loginError"
        class="error"
      ></p>

    </section>

  </main>



  <!-- ======================================================
       APP
       ====================================================== -->

  <main
    id="appView"
    hidden
  >


    <!-- ====================================================
         HEADER
         ==================================================== -->

    <header>

      <div>

        <h1>
          My Budget
        </h1>


        <!-- Month Navigation -->

        <div class="month-navigation">

          <button
            id="previousMonth"
            class="month-button"
            type="button"
            aria-label="Previous month"
          >
            ‹
          </button>


          <p id="monthName">
            Month
          </p>


          <button
            id="nextMonth"
            class="month-button"
            type="button"
            aria-label="Next month"
          >
            ›
          </button>

        </div>

      </div>


      <button
        id="logoutButton"
        class="secondary"
        type="button"
      >
        Sign Out
      </button>

    </header>



    <!-- ====================================================
         DASHBOARD SUMMARY
         ==================================================== -->

    <section class="summary-grid">


      <!-- Spent -->

      <div class="summary-card">

        <span class="summary-label">
          Spent
        </span>

        <strong id="spent">
          $0.00
        </strong>

      </div>



      <!-- Remaining -->

      <div class="summary-card">

        <span class="summary-label">
          Remaining
        </span>

        <strong id="remaining">
          $0.00
        </strong>

      </div>



      <!-- Total Savings -->

      <div class="summary-card">

        <span class="summary-label">
          Total Savings
        </span>

        <strong id="savings">
          $0.00
        </strong>

      </div>


    </section>



    <!-- ====================================================
         SETTINGS
         ==================================================== -->

    <section class="card">

      <h2>
        Settings
      </h2>



      <!-- Monthly Budget -->

      <div class="setting-row">

        <label for="budgetInput">
          Monthly Budget
        </label>


        <div class="setting-control">

          <input
            id="budgetInput"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
          >


          <button
            id="saveBudget"
            type="button"
          >
            Save
          </button>

        </div>

      </div>



      <!-- Savings Goal -->

      <div class="setting-row">

        <label for="goalInput">
          Savings Goal
        </label>


        <div class="setting-control">

          <input
            id="goalInput"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
          >


          <button
            id="saveGoal"
            type="button"
          >
            Save
          </button>

        </div>

      </div>



      <!-- Manual Savings Adjustment -->

      <div class="setting-row">

        <label for="adjustmentInput">
          Manual Savings Adjustment
        </label>


        <div class="setting-control">

          <input
            id="adjustmentInput"
            type="number"
            step="0.01"
            placeholder="0.00"
          >


          <button
            id="saveAdjustment"
            type="button"
          >
            Save
          </button>

        </div>


        <small>
          Add extra savings with a positive number,
          or record a withdrawal with a negative number.
        </small>

      </div>


    </section>



    <!-- ====================================================
         ADD EXPENSE
         ==================================================== -->

    <section class="card">

      <h2>
        Add Expense
      </h2>


      <!-- Amount -->

      <label for="amountInput">
        Amount
      </label>

      <input
        id="amountInput"
        type="number"
        min="0"
        step="0.01"
        inputmode="decimal"
        placeholder="0.00"
      >



      <!-- Category -->

      <label for="categoryInput">
        Category
      </label>

      <select id="categoryInput">

        <option value="Food">
          Food
        </option>

        <option value="Transportation">
          Transportation
        </option>

        <option value="Shopping">
          Shopping
        </option>

        <option value="Entertainment">
          Entertainment
        </option>

        <option value="Bills">
          Bills
        </option>

        <option value="Health">
          Health
        </option>

        <option value="Other">
          Other
        </option>

      </select>



      <!-- Description -->

      <label for="descriptionInput">
        Description
      </label>

      <input
        id="descriptionInput"
        type="text"
        placeholder="Optional"
      >



      <!-- Date -->

      <label for="dateInput">
        Date
      </label>

      <input
        id="dateInput"
        type="date"
      >



      <!-- Add -->

      <button
        id="addExpenseButton"
        type="button"
      >
        Add Expense
      </button>

    </section>



    <!-- ====================================================
         TRANSACTIONS
         ==================================================== -->

    <section class="card">

      <h2>
        Transactions
      </h2>


      <div id="transactions">

        <p>
          No expenses this month.
        </p>

      </div>

    </section>


  </main>



  <!-- ======================================================
       JAVASCRIPT
       ====================================================== -->

  <script
    src="./config.js"
  ></script>


  <script
    type="module"
    src="./app.js"
  ></script>


</body>

</html>
